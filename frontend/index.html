<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  
</head>
<!-- PHASE 2: build the page here.

     Your backend (Phase 1) is already running with real data in it,
     so build this page straight against the API - there is no
     in-memory or localStorage stage this time.

     1. Navbar
     2. Summary cards: total amount, number of expenses, highest expense
     3. Form to add an expense: title, amount, category (select), date

     4. Filter by category (with an "All" option)

     5. Table: title, amount, category, date, an edit button, a delete button

     Remember: the table rows must be built with JavaScript (DOM),
     not written by hand in this file. -->

<body class="body">
  <nav class="navbar navbar-light bg-dark ">
    <div class="container-fluid">
      <div class="container">
        <a class="navbar-brand text-white font-weight-bold" href="#">Expense Tracker</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <!-- Card info -->
    <section class="row mt-4 mb-4">

      <div class="col-4">
        <div class="card">
          <div class="card-body text-center">
            Total Amount: <h3 id="total-amount">0</h3>
          </div>
        </div>
      </div>

      <div class="col-4">
        <div class="card ">
          <div class="card-body text-center">
            Number of Expenses: <h3 id="number-of-expenses">0</h3>
          </div>
        </div>
      </div>

      <div class="col-4">
        <div class="card col">
          <div class="card-body text-center">
            Highest Expense: <h3 id="highest-expense">0</h3>
          </div>
        </div>
      </div>

    </section>

    <!-- Form -->
    <section class="card mb-4">
      <div class="card-body">
        <h3 class="mb-4">Add expense</h3>
        <form id="expense-form" class="row g-3">

          <section class="row">

            <div class="col-4 mb-3">
              <label for="title">Title</label>
              <input type="text" class="form-control" id="title" placeholder="Lunch" required>
            </div>

            <div class="col-2 mb-3">
              <label for="amount">Amount</label>
              <input type="text" class="form-control" id="amount" placeholder="10.00" required >
            </div>

            <div class="col-3 mb-3">
              <label for="category">Category</label>
              <select class="form-select" id="category" required>
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="col-3 mb-3">
              <label for="date">Date</label>
              <input type="date" class="form-control" id="date" required>
            </div>

          </section>
          <div class="row">
            <button type="submit" class="btn btn-primary col-2" id="btn-add">Add Expense</button>
          </div>

        </form>

      </div>
    </section>

    <!-- Data-->
    <section class="card">
      <div class="card-body">
        <div class="row">

          <h4 class="col-9 mb-3">Expenses</h4>

          <div class="col-3 d-flex align-items-center gap-2 mb-3">
            <label for="filter-category">Category</label>
            <select class="form-select" id="filter-category">
              <option value="">All</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <table class="table table-striped">
            <thead>
              <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="table-body">
             
              
              <tr id="table-spinner">
                <td colspan="5" class="text-center">
                  <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                  </div>
                </td>
              </tr>

              </tbody>
          </table>

        </div>
      </div>
    </section>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>

</html>
